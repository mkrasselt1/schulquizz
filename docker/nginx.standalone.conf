# nginx-Konfiguration für das STANDALONE-Image (alles in einem Container).
# php-fpm und Reverb laufen lokal (127.0.0.1).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 26M;

    # Logs nicht als wachsende Dateien im Container: Fehler ins Container-Log, Zugriffe aus.
    access_log off;
    error_log /dev/stderr warn;

    # Grundlegende Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Reverb-WebSocket (Pusher-Protokoll) über Port 80 proxien.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # /apps (Reverb-HTTP-API zum Senden von Events) bewusst NICHT nach außen geben –
    # die App spricht Reverb intern über 127.0.0.1:8080 an.
    location /apps {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
