map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 26M;

    # Datensparsam: keine Zugriffslogs (enthielten IPs und Beitritts-Links), Fehler ins Container-Log.
    access_log off;
    error_log /dev/stderr warn;

    # Grundlegende Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Reverb-WebSocket (Pusher-Protokoll) über denselben Port proxien.
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # /apps (Reverb-HTTP-API zum Senden von Events) bewusst NICHT nach außen geben –
    # die App spricht Reverb intern über reverb:8080 an.
    location /apps {
        return 404;
    }

    # Hochgeladene/KI-gezeichnete SVGs: zusätzlich zur Bereinigung beim Speichern
    # keinerlei Skripte/Nachladen erlauben, falls jemand die Datei direkt öffnet.
    location ~* ^/storage/.+\.svg$ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
