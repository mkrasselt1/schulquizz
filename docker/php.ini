; PHP-Einstellungen für den Container-Betrieb.
; Ohne eigene ini gelten PHP-Defaults (u. a. upload_max_filesize = 2M) – zu wenig für Handyfotos.

upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

; Opcache: Code im Image ändert sich nie → Timestamps nicht prüfen.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
