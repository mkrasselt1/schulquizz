name: Docker Image

# Baut das Docker-Image und pusht es zu Docker Hub – automatisch bei jedem Tag
# (z.B. dev-0.1) sowie manuell über die Actions-Oberfläche.
#
# Benötigt zwei Repository-Secrets:
#   DOCKERHUB_USERNAME  – dein Docker-Hub-Benutzername
#   DOCKERHUB_TOKEN     – ein Docker-Hub Access Token (Account Settings → Security)
#
# Das Image landet unter  <DOCKERHUB_USERNAME>/schulquizz:<tag>  und :latest.

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadaten / Tags ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/schulquizz
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Bauen & Pushen (self-contained Standalone-Image)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
