name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, gd, zip, intl, bcmath, pcntl
          coverage: none

      - name: Composer-Abhängigkeiten
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: NPM install & Build
        run: |
          npm ci
          npm run build

      - name: App-Key & Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
