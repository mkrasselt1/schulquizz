name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  # 1) Unit-/Feature-Tests gegen SQLite (schnell) + Frontend-Build-Prüfung
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, gd, zip, intl, bcmath, pcntl
          coverage: none

      - name: Composer-Abhängigkeiten
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: NPM install & Build
        run: |
          npm ci
          npm run build

      - name: Build-Prüfung – ist Tailwind-CSS wirklich kompiliert?
        run: |
          CSS=$(ls public/build/assets/app-*.css | head -1)
          SIZE=$(wc -c < "$CSS")
          echo "CSS $CSS = $SIZE Bytes"
          test "$SIZE" -gt 20000 || (echo "FEHLER: CSS zu klein – Tailwind nicht kompiliert" && exit 1)
          grep -q '\.flex' "$CSS" || (echo "FEHLER: keine Tailwind-Klassen im CSS" && exit 1)

      - name: App-Key & Tests (SQLite)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  # 2) Container-Smoke-Test: baut das echte Standalone-Image und spielt einen Ablauf
  #    durch – gegen ECHTE MariaDB. Deckt damit den MySQL-Pfad (Migrationen/Fremd-
  #    schlüssel-Reihenfolge) UND die Deployment-Bugs ab, die Unit-Tests nicht sehen
  #    (Reverb-Erreichbarkeit, Nachrichtengröße für Bild-Antworten, Entrypoint, HTTP).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-Test (echtes Image + MariaDB)
        run: bash scripts/smoke-test.sh
