# Fertiges Docker-Hub-Image (All-in-one: nginx, PHP, Reverb, Queue, Scheduler) + MariaDB –
# OHNE Neu-Build.
#
# Verwendung:
#   1. .env anlegen: cp .env.docker.example .env  (APP_URL/DB-Passwörter setzen)
#   2. docker compose -f docker-compose.hub.yml up -d
#   → App unter http://localhost:8000 (per Reverse-Proxy mit HTTPS ausliefern)
#
# Image-Tag bei Bedarf anpassen (IMAGE env, z. B. IMAGE=mkrasselt1/schulquizz:v1.0).

x-logging: &logging
  # Container-Logs begrenzen (Fehler-Logs nicht unbegrenzt aufbewahren)
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  app:
    image: ${IMAGE:-mkrasselt1/schulquizz:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      mariadb:
        condition: service_healthy
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      # Reverb läuft im selben Container und wird nur intern angesprochen.
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      # Nur lokal binden – davor gehört ein Reverse-Proxy mit HTTPS.
      - "127.0.0.1:8000:80"
    volumes:
      - app-storage:/var/www/html/storage
    networks: [schulquizz]

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-schulquizz}
      MARIADB_USER: ${DB_USERNAME:-schulquizz}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [schulquizz]

volumes:
  db-data:
  app-storage:

networks:
  schulquizz:
