# Docker-Compose für Self-Hosting (Schul-Server) oder EU-Cloud.
# Startet App (PHP-FPM), nginx, MariaDB und den Reverb-WebSocket-Server.
# Kein Redis: Queue/Cache laufen über die Datenbank.

x-logging: &logging
  # Container-Logs begrenzen (Fehler-Logs nicht unbegrenzt aufbewahren)
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    logging: *logging
    depends_on:
      mariadb:
        condition: service_healthy
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
    volumes:
      - app-storage:/var/www/html/storage
      - public-data:/var/www/html/public
    networks: [schulquizz]

  reverb:
    build:
      context: .
      target: app
    restart: unless-stopped
    logging: *logging
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - app
    env_file: .env
    environment:
      CONTAINER_ROLE: reverb
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
    # Nur intern erreichbar (Browser kommen über nginx /app); Volume für das erzeugte Secret.
    expose: ["8080"]
    volumes:
      - app-storage:/var/www/html/storage
    networks: [schulquizz]

  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    logging: *logging
    command: php artisan queue:work --tries=3 --sleep=1
    depends_on:
      - app
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
    volumes:
      - app-storage:/var/www/html/storage
    networks: [schulquizz]

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    logging: *logging
    command: php artisan schedule:work
    depends_on: [app]
    env_file: .env
    environment:
      CONTAINER_ROLE: scheduler
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
    volumes:
      - app-storage:/var/www/html/storage
    networks: [schulquizz]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public-data:/var/www/html/public:ro
      # Uploads: public/storage ist ein Symlink nach storage/app/public
      - app-storage:/var/www/html/storage:ro
    networks: [schulquizz]

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-schulquizz}
      MARIADB_USER: ${DB_USERNAME:-schulquizz}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      # Persistenz optional: Default = benanntes Volume "db-data".
      # In .env DB_DATA_PATH=./pfad setzen für einen Host-Ordner,
      # oder das Ephemer-Override nutzen (tmpfs, keine Persistenz).
      - ${DB_DATA_PATH:-db-data}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [schulquizz]

volumes:
  db-data:
  app-storage:
  public-data:

networks:
  schulquizz:
